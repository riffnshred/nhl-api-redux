# Runs the live contract tests against the NHL API to catch payload changes.
#
# On a scheduled or manual run, a failure opens an issue labelled `api-contract`
# (or comments on the open one), and the next passing run closes it. Runs during
# the NHL preseason are also labelled `preseason` and flagged in the title, since
# the API is unstable then.
name: NHL API contract

on:
  schedule:
    # GitHub schedules in UTC only: 16:30 UTC is 12:30 Eastern in summer (EDT)
    # and 11:30 in winter (EST).
    - cron: "30 16 * * *"
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NHL_API_REPORT: ${{ github.workspace }}/api-contract-report.md
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      - name: Run contract tests
        id: tests
        # Reruns absorb a flaky network or a momentary API hiccup.
        run: uv run pytest -v -rs --reruns 2 --reruns-delay 30

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$NHL_API_REPORT" ]; then
            cat "$NHL_API_REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tests did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON_STATE: ${{ steps.tests.outputs.season_state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-contract --color D93F0B --description "NHL API contract check" --force
          gh label create preseason --color FBCA04 --description "Seen during the NHL preseason" --force

          title="NHL API contract check failing"
          labels="api-contract"
          if [ "$SEASON_STATE" = "preseason" ]; then
            title="[preseason] $title"
            labels="$labels,preseason"
          fi

          { [ -f "$NHL_API_REPORT" ] && cat "$NHL_API_REPORT" || echo "Tests did not produce a report."
            echo; echo "Run: $RUN_URL"; } > body.md

          existing=$(gh issue list --label api-contract --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            [ "$SEASON_STATE" = "preseason" ] && gh issue edit "$existing" --add-label preseason
          else
            gh issue create --title "$title" --label "$labels" --body-file body.md
          fi

      - name: Close resolved issue
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label api-contract --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Contract check passing again: $RUN_URL"
          fi
